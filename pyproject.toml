[project]
name = "anexotlook"
version = "0.2"
description = "Extração de anexos do Outlook usando PySide6 e QFluentWidgets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6-fluent-widgets>=1.4.0",
    "pyside6>=6.6.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
